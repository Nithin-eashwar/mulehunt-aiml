# hex mirrors of app/assets/tokens.css (Piste); Streamlit's theme cannot read CSS variables
[theme]
base = "light"
primaryColor = "#1f50f5"
backgroundColor = "#f8fafe"
secondaryBackgroundColor = "#edf0f6"
textColor = "#0a0d12"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
