# hex mirrors of app/assets/tokens.css (Dusk); Streamlit's theme cannot read CSS variables
[theme]
base = "dark"
primaryColor = "#a0b0f4"
backgroundColor = "#0e1017"
secondaryBackgroundColor = "#151820"
textColor = "#f4f1ed"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
