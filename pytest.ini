[pytest]
pythonpath = .
testpaths = tests
# Deprecation notices raised inside pinned scikit-learn / matplotlib by their newer
# (unpinned) dependencies scipy and pyparsing; not from our code.
filterwarnings =
    ignore::DeprecationWarning:sklearn.*
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:pyparsing.*
